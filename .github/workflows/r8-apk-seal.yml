name: R8 APK artifact seal

on:
  pull_request:
    paths:
      - 'apps/r8/android/**'
      - 'src/android/shared/sabledesign/**'
      - 'apps/r8/rust/**'
      - 'build/supply-chain-lock.json'
      - 'build/generate-supply-chain-evidence.py'
      - '.github/workflows/r8-apk-seal.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r8-apk-seal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seal:
    runs-on: ubuntu-22.04
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.98.1'
          targets: aarch64-linux-android
      - name: Locate Android SDK tools
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          test -n "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
      - name: Install Android SDK 36
        shell: bash
        run: "$SDKMANAGER 'platforms;android-36' 'build-tools;36.0.0' 'ndk;30.0.16248370'"
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          gradle-version: '8.13'
      - name: Build qualification APKs
        run: >-
          gradle -p apps/r8/android
          :calculator:assembleDebug
          :convert:assembleDebug
          :games:assembleDebug
          :media:assembleDebug
          --stacktrace
      - name: Seal package identities, permissions and hashes
        shell: bash
        run: |
          set -euo pipefail
          AAPT2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          test -x "$AAPT2"
          : > R8_APK_SEALS.txt
          while IFS= read -r apk; do
            echo "===== $apk =====" | tee -a R8_APK_SEALS.txt
            sha256sum "$apk" | tee -a R8_APK_SEALS.txt
            "$AAPT2" dump badging "$apk" | grep -E '^(package:|application-label:)' | tee -a R8_APK_SEALS.txt
            "$AAPT2" dump permissions "$apk" | tee -a R8_APK_SEALS.txt
          done < <(find apps/r8/android -path '*/build/outputs/apk/debug/*.apk' -type f | sort)
          test "$(grep -c '^===== ' R8_APK_SEALS.txt)" -eq 4
      - name: Generate deterministic artifact provenance and Rust SBOM
        run: >-
          python3 build/generate-supply-chain-evidence.py
          --out R8_SUPPLY_CHAIN_PROVENANCE.json
          --rust-sbom R8_RUST_SBOM.cdx.json
          --artifact-glob 'apps/r8/android/*/build/outputs/apk/debug/*.apk'
      - name: Seal provenance files
        run: >-
          sha256sum
          R8_SUPPLY_CHAIN_PROVENANCE.json
          R8_RUST_SBOM.cdx.json
          > R8_SUPPLY_CHAIN_PROVENANCE.sha256
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: r8-qualification-apks-${{ github.sha }}
          path: |
            apps/r8/android/*/build/outputs/apk/debug/*.apk
            R8_APK_SEALS.txt
            R8_SUPPLY_CHAIN_PROVENANCE.json
            R8_RUST_SBOM.cdx.json
            R8_SUPPLY_CHAIN_PROVENANCE.sha256
          if-no-files-found: error
          retention-days: 14

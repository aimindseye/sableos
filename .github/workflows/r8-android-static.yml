name: R8 Android static analysis

on:
  pull_request:
    paths:
      - 'apps/r8/android/**'
      - '.github/workflows/r8-android-static.yml'
  push:
    branches: [main]
    paths:
      - 'apps/r8/android/**'
      - '.github/workflows/r8-android-static.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r8-android-static-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate hosted Android SDK tools
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          test -n "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
      - name: Install Android SDK 36
        shell: bash
        run: "$SDKMANAGER 'platforms;android-36' 'build-tools;36.0.0'"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Android Lint
        run: >-
          gradle -p apps/r8/android
          :design:lintDebug
          :calculator:lintDebug
          :convert:lintDebug
          :games:lintDebug
          :media:lintDebug
          --stacktrace

name: Security baseline

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

concurrency:
  group: security-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'

  mobsfscan:
    name: MobSF Android source baseline
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Run pinned mobsfscan baseline
        uses: MobSF/mobsfscan@a43635d92434e78b079ed7d860f022cf6c886b43
        with:
          args: 'apps/r8/android --sarif --output mobsfscan-results.sarif --type android --no-fail'
      - name: Summarize SARIF baseline
        shell: bash
        run: |
          set -euo pipefail
          test -s mobsfscan-results.sarif
          python3 - <<'PY'
          import json
          from pathlib import Path
          doc = json.loads(Path('mobsfscan-results.sarif').read_text(encoding='utf-8'))
          results = sum(len(run.get('results', [])) for run in doc.get('runs', []))
          print(f'MOBSFSCAN_SARIF_RESULT_COUNT={results}')
          with open(__import__('os').environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write(f'### MobSFScan baseline\n\nFindings recorded: **{results}**\n')
          PY
      - name: Upload MobSF SARIF evidence
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: mobsfscan-baseline-${{ github.sha }}
          path: mobsfscan-results.sarif
          if-no-files-found: error
          retention-days: 30

  rust-policy:
    name: Rust dependency policy
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/r8/rust
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.98.1'
      - name: Verify committed dependency lock
        run: cargo metadata --locked --no-deps --format-version 1 >/dev/null
      - name: Install pinned cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Enforce advisory, ban and source policy
        run: cargo deny check advisories bans sources

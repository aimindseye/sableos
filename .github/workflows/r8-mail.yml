name: R8 Sable Mail compile and policy

on:
  pull_request:
    paths:
      - 'apps/r8/mail/**'
      - 'src/android/shared/sabledesign/**'
      - 'src/android/packages/apps/SableStart/**'
      - '.github/workflows/r8-mail.yml'
  push:
    branches: [main]
    paths:
      - 'apps/r8/mail/**'
      - 'src/android/shared/sabledesign/**'
      - 'src/android/packages/apps/SableStart/**'
      - '.github/workflows/r8-mail.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r8-mail-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mail:
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'

      - name: Read pinned Thunderbird identity
        id: pin
        shell: bash
        run: |
          set -euo pipefail
          source apps/r8/mail/upstream.env
          echo "repository=$THUNDERBIRD_REPOSITORY" >> "$GITHUB_OUTPUT"
          echo "commit=$THUNDERBIRD_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Locate Android SDK tools
        shell: bash
        run: |
          set -euo pipefail
          test -d "$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 4 -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          APKANALYZER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 4 -type f -name apkanalyzer -print -quit 2>/dev/null || true)"
          test -n "$SDKMANAGER"
          test -n "$APKANALYZER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "APKANALYZER=$APKANALYZER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

      - name: Install Android SDK 36
        shell: bash
        run: "$SDKMANAGER 'platforms;android-36' 'build-tools;36.0.0'"

      - name: Checkout pinned Thunderbird Android source
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-tags --filter=blob:none "${{ steps.pin.outputs.repository }}" /tmp/sable-mail
          git -C /tmp/sable-mail fetch --depth=1 origin "${{ steps.pin.outputs.commit }}"
          git -C /tmp/sable-mail checkout --detach "${{ steps.pin.outputs.commit }}"
          test "$(git -C /tmp/sable-mail rev-parse HEAD)" = "${{ steps.pin.outputs.commit }}"

      - name: Apply Sable Mail product adaptation
        run: python3 apps/r8/mail/apply_sable_flavor.py /tmp/sable-mail

      - name: Verify composed Sable Mail source policy
        run: python3 apps/r8/mail/verify_sable_mail.py /tmp/sable-mail

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c

      - name: Thunderbird upstream unit tests under Sable composition
        working-directory: /tmp/sable-mail
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app-thunderbird:testFossReleaseUnitTest \
            --stacktrace --console=plain --no-daemon --no-configuration-cache

      - name: Sable Mail Android Lint
        working-directory: /tmp/sable-mail
        run: |
          ./gradlew :app-thunderbird:lintFossRelease \
            --stacktrace --console=plain --no-daemon --no-configuration-cache

      - name: Prove excluded product dependencies
        working-directory: /tmp/sable-mail
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app-thunderbird:dependencies \
            --configuration fossReleaseRuntimeClasspath \
            --console=plain --no-daemon --no-configuration-cache \
            | tee /tmp/sable-mail/SABLE_MAIL_RUNTIME_DEPENDENCIES.txt

          if grep -E             'feature:thundermail|feature:funding:(link|googleplay)|feature:telemetry:glean|backend:demo|autodiscovery:demo'             /tmp/sable-mail/SABLE_MAIL_RUNTIME_DEPENDENCIES.txt
          then
            echo "SABLE_MAIL_STALE_RUNTIME_DEPENDENCY=FAIL"
            exit 1
          fi

          grep -Fq 'feature:funding:noop'             /tmp/sable-mail/SABLE_MAIL_RUNTIME_DEPENDENCIES.txt
          grep -Fq 'feature:telemetry:noop'             /tmp/sable-mail/SABLE_MAIL_RUNTIME_DEPENDENCIES.txt

          echo "SABLE_MAIL_STALE_RUNTIME_DEPENDENCY=PASS_ABSENT"

      - name: Build Sable Mail APK
        working-directory: /tmp/sable-mail
        run: |
          ./gradlew :app-thunderbird:assembleFossRelease \
            --stacktrace --console=plain --no-daemon --no-configuration-cache

      - name: Verify and seal Sable Mail APK
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(
            find /tmp/sable-mail/app-thunderbird/build/outputs/apk/foss/release \
              -maxdepth 1 -type f -name '*.apk' -print | sort
          )
          test "${#apks[@]}" -eq 1
          python3 apps/r8/mail/verify_sable_mail.py /tmp/sable-mail "${apks[0]}"
          sha256sum "${apks[0]}" | tee /tmp/sable-mail/SABLE_MAIL_APK_SHA256.txt

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: r8-sable-mail-qualification-apk
          path: |
            /tmp/sable-mail/app-thunderbird/build/outputs/apk/foss/release/*.apk
            /tmp/sable-mail/SABLE_MAIL_APK_SHA256.txt
            /tmp/sable-mail/SABLE_MAIL_RUNTIME_DEPENDENCIES.txt
          if-no-files-found: error

name: R8 Android qualification

on:
  pull_request:
    paths:
      - 'apps/r8/android/**'
      - '.github/workflows/r8-android.yml'
  push:
    branches: [main]
    paths:
      - 'apps/r8/android/**'
      - '.github/workflows/r8-android.yml'

permissions:
  contents: read

concurrency:
  group: r8-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate hosted Android SDK tools
        shell: bash
        run: |
          set -euo pipefail
          test -d "$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $ANDROID_HOME/cmdline-tools" >&2
            find "$ANDROID_HOME" -maxdepth 4 -type f -name sdkmanager -print >&2 || true
            exit 1
          fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version
      - name: Install Android SDK 36
        shell: bash
        run: "$SDKMANAGER 'platforms;android-36' 'build-tools;36.0.0'"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Shared design unit tests
        run: gradle -p apps/r8/android :design:testDebugUnitTest --stacktrace
      - name: Compile debug APKs
        run: >-
          gradle -p apps/r8/android
          :calculator:assembleDebug
          :convert:assembleDebug
          :games:assembleDebug
          :media:assembleDebug
          --stacktrace
      - name: Android lint
        run: >-
          gradle -p apps/r8/android
          :design:lintDebug
          :calculator:lintDebug
          :convert:lintDebug
          :games:lintDebug
          :media:lintDebug
          --stacktrace

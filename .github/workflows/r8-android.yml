name: R8 Android qualification

on:
  pull_request:
    paths:
      - 'apps/r8/android/**'
      - '.github/workflows/r8-android.yml'
  push:
    branches: [main]
    paths:
      - 'apps/r8/android/**'
      - '.github/workflows/r8-android.yml'

permissions:
  contents: read

concurrency:
  group: r8-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Shared design unit tests
        run: gradle -p apps/r8/android :design:testDebugUnitTest --stacktrace
      - name: Compile debug APKs
        run: >-
          gradle -p apps/r8/android
          :calculator:assembleDebug
          :convert:assembleDebug
          :games:assembleDebug
          :media:assembleDebug
          --stacktrace
      - name: Android lint
        run: >-
          gradle -p apps/r8/android
          :design:lintDebug
          :calculator:lintDebug
          :convert:lintDebug
          :games:lintDebug
          :media:lintDebug
          --stacktrace

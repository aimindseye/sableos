name: R8 Android compile and tests

on:
  pull_request:
    paths:
      - 'apps/r8/android/**'
      - '.github/workflows/r8-android.yml'
  push:
    branches: [main]
    paths:
      - 'apps/r8/android/**'
      - '.github/workflows/r8-android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r8-android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-22.04
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.98.1'
          targets: aarch64-linux-android
      - name: Locate hosted Android SDK tools
        shell: bash
        run: |
          set -euo pipefail
          test -d "$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $ANDROID_HOME/cmdline-tools" >&2
            find "$ANDROID_HOME" -maxdepth 5 -type f -name sdkmanager -print >&2 || true
            exit 1
          fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version
      - name: Install Android SDK 36
        shell: bash
        run: "$SDKMANAGER 'platforms;android-36' 'build-tools;36.0.0' 'ndk;30.0.16248370'"
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          gradle-version: '8.13'
      - name: Shared design unit tests
        run: gradle -p apps/r8/android :design:testDebugUnitTest --stacktrace
      - name: Compile debug APKs
        run: >-
          gradle -p apps/r8/android
          :calculator:assembleDebug
          :games:assembleDebug
          :media:assembleDebug
          --stacktrace

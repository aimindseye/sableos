name: R8 quality and coverage baseline

on:
  pull_request:
    paths:
      - 'apps/r8/android/**'
      - 'src/android/shared/sabledesign/**'
      - 'apps/r8/rust/**'
      - 'build/check-ci-policy.py'
      - 'build/supply-chain-lock.json'
      - 'build/install-pinned-tool.py'
      - '.github/workflows/quality-coverage.yml'
  push:
    branches: [main]
    paths:
      - 'apps/r8/android/**'
      - 'src/android/shared/sabledesign/**'
      - 'apps/r8/rust/**'
      - 'build/check-ci-policy.py'
      - 'build/supply-chain-lock.json'
      - 'build/install-pinned-tool.py'
      - '.github/workflows/quality-coverage.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r8-quality-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-quality-coverage:
    name: Android quality and Kotlin coverage baseline
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate hosted Android SDK tools
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          test -n "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
      - name: Install Android SDK 36
        shell: bash
        run: "$SDKMANAGER 'platforms;android-36' 'build-tools;36.0.0'"
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          gradle-version: '8.13'
      - name: Run detekt and ktlint baselines plus Kover
        run: >-
          gradle -p apps/r8/android
          :design:detekt
          :calculator:detekt
          :convert:detekt
          :games:detekt
          :media:detekt
          :design:ktlintCheck
          :calculator:ktlintCheck
          :convert:ktlintCheck
          :games:ktlintCheck
          :media:ktlintCheck
          :design:koverXmlReportDebug
          :design:koverHtmlReportDebug
          --stacktrace
      - name: Summarize Kotlin quality and coverage baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          import xml.etree.ElementTree as ET

          root = Path("apps/r8/android")
          detekt = [p for p in sorted(root.glob("*/build/reports/detekt/*")) if p.is_file()]
          ktlint = [p for p in sorted(root.glob("*/build/reports/ktlint/**/*")) if p.is_file()]
          if not detekt:
              raise SystemExit("detekt reports not found")
          if not ktlint:
              raise SystemExit("ktlint reports not found")

          report = root / "design" / "build" / "reports" / "kover" / "reportDebug.xml"
          if not report.is_file() or report.stat().st_size == 0:
              raise SystemExit(f"Kover XML report missing: {report}")

          doc = ET.parse(report).getroot()
          line = next((c for c in doc.findall("counter") if c.attrib.get("type") == "LINE"), None)
          if line is None:
              raise SystemExit("Kover LINE counter missing")
          missed = int(line.attrib["missed"])
          covered = int(line.attrib["covered"])
          total = missed + covered
          pct = (covered * 100.0 / total) if total else 0.0

          print(f"DETEKT_REPORT_FILE_COUNT={len(detekt)}")
          print(f"KTLINT_REPORT_FILE_COUNT={len(ktlint)}")
          print(f"KOVER_LINE_COVERED={covered}")
          print(f"KOVER_LINE_MISSED={missed}")
          print(f"KOVER_LINE_PERCENT={pct:.2f}")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("### Android quality / Kotlin coverage baseline\n\n")
              f.write(f"- detekt report files: **{len(detekt)}**\n")
              f.write(f"- ktlint report files: **{len(ktlint)}**\n")
              f.write(f"- Kover line coverage: **{pct:.2f}%** ({covered}/{total})\n")
              f.write("- Coverage is baseline-only in INFRA2B3; no percentage threshold is enforced.\n")
          PY
      - name: Upload Android quality and coverage evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: r8-android-quality-coverage-${{ github.sha }}
          path: |
            apps/r8/android/*/build/reports/detekt/**
            apps/r8/android/*/build/reports/ktlint/**
            apps/r8/android/design/build/reports/kover/**
          if-no-files-found: error
          retention-days: 30

  rust-coverage:
    name: Rust coverage baseline
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/r8/rust
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.98.1'
          components: llvm-tools-preview
      - name: Verify committed dependency lock
        run: cargo metadata --locked --no-deps --format-version 1 >/dev/null
      - name: Install checksum-verified cargo-llvm-cov
        shell: bash
        run: |
          set -euo pipefail
          DEST="$RUNNER_TEMP/sable-pinned-tools"
          python3 "$GITHUB_WORKSPACE/build/install-pinned-tool.py" \
            --tool cargo-llvm-cov \
            --dest "$DEST"
          echo "$DEST" >> "$GITHUB_PATH"
      - name: Generate Rust coverage baseline
        run: cargo llvm-cov --workspace --locked --lcov --output-path coverage.lcov
      - name: Summarize Rust coverage baseline
        shell: bash
        run: |
          set -euo pipefail
          test -s coverage.lcov
          python3 - <<'PY'
          from pathlib import Path
          import os

          path = Path("coverage.lcov")
          found = 0
          hit = 0
          for line in path.read_text(encoding="utf-8").splitlines():
              if line.startswith("LF:"):
                  found += int(line[3:])
              elif line.startswith("LH:"):
                  hit += int(line[3:])
          if found <= 0:
              raise SystemExit("LCOV line total is zero")
          pct = hit * 100.0 / found

          print(f"RUST_COVERAGE_LINES_HIT={hit}")
          print(f"RUST_COVERAGE_LINES_FOUND={found}")
          print(f"RUST_COVERAGE_LINE_PERCENT={pct:.2f}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("### Rust coverage baseline\n\n")
              f.write(f"- line coverage: **{pct:.2f}%** ({hit}/{found})\n")
              f.write("- Coverage is baseline-only in INFRA2B3; no percentage threshold is enforced.\n")
          PY
      - name: Upload Rust coverage evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: r8-rust-coverage-${{ github.sha }}
          path: apps/r8/rust/coverage.lcov
          if-no-files-found: error
          retention-days: 30

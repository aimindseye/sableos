name: R8 final UI closure static

on:
  pull_request:
    paths:
      - 'build/panther/**'
      - 'build/config/r8-*.env'
      - 'build/host/**'
      - 'build/gates/**'
      - 'product/r8/panther/**'
      - 'patches/android-17-grapheneos-2026081300/**'
      - 'src/android/packages/apps/SableStart/**'
      - 'src/android/shared/sabledesign/**'
      - 'apps/r8/reader/**'
      - 'apps/r8/mail/**'
      - 'apps/r8/android/**'
      - 'build/verify-reader-manifest.py'
      - '.github/workflows/r8-final-ui-closure.yml'
  push:
    branches: [main]
    paths:
      - 'build/panther/**'
      - 'build/config/r8-*.env'
      - 'build/host/**'
      - 'build/gates/**'
      - 'product/r8/panther/**'
      - 'patches/android-17-grapheneos-2026081300/**'
      - 'src/android/packages/apps/SableStart/**'
      - 'src/android/shared/sabledesign/**'
      - 'apps/r8/reader/**'
      - 'apps/r8/mail/**'
      - 'build/verify-reader-manifest.py'
      - '.github/workflows/r8-final-ui-closure.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r8-final-ui-static-${{ github.ref }}
  cancel-in-progress: true

jobs:
  closure-static:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Shell syntax
        shell: bash
        run: |
          set -euo pipefail
          for script in \
            apps/r8/export-panther-app-bundle.sh \
            build/host/verify-r8-host-tools.sh \
            build/host/migrate-r8-final-v1-host-tools.sh \
            build/panther/render-r8-build-driver.sh \
            build/panther/run-r8-release-candidate.sh \
            build/panther/retire-r8-obsolete-gradle-residue.sh \
            build/panther/retire-r8-legacy-sable-device-product.sh \
            build/panther/retire-r8-legacy-vendor-config.sh \
            build/panther/sync-sablestart.sh \
            build/panther/stage-r8-product-apps.sh \
            build/panther/prepare-r8-final-ui.sh \
            build/panther/qualify-r9-launcher3-foundation.sh \
            build/panther/build-r8-final-ui.sh \
            build/gates/r8-build-driver-contract.sh \
            build/gates/r8-final-product-composition.sh \
            build/gates/r8-final-target-files.sh \
            build/gates/r8-no-stale-product-code.sh
          do
            bash -n "$script"
            echo "SHELL_SYNTAX=PASS $script"
          done

      - name: Python syntax
        run: |
          python3 -m py_compile \
            build/gates/verify-r8-vendor-sable-inventory.py \
            build/gates/r9-sablestart-design-contract.py \
            build/gates/r9-launcher3-foundation-contract.py \
            apps/r8/reader/apply_sable_flavor.py \
            apps/r8/mail/apply_sable_flavor.py \
            apps/r8/mail/verify_sable_mail.py \
            build/verify-reader-manifest.py \
            patches/android-17-grapheneos-2026081300/apply_sable_branding.py \
            patches/android-17-grapheneos-2026081300/apply_ui4_systemui.py \
            patches/android-17-grapheneos-2026081300/apply_ui5a_settings.py \
            patches/android-17-grapheneos-2026081300/apply_ui5b_app_security.py \
            patches/android-17-grapheneos-2026081300/apply_ui5c_ui6_system_surfaces.py \
            patches/android-17-grapheneos-2026081300/apply_r9_launcher3_foundation.py
          echo "PYTHON_SYNTAX=PASS"

      - name: Platform applicator self-tests
        run: |
          set -euo pipefail
          python3 patches/android-17-grapheneos-2026081300/apply_sable_branding.py --self-test
          python3 patches/android-17-grapheneos-2026081300/apply_ui4_systemui.py --self-test
          python3 patches/android-17-grapheneos-2026081300/apply_ui5a_settings.py --self-test
          python3 patches/android-17-grapheneos-2026081300/apply_ui5b_app_security.py --self-test
          python3 patches/android-17-grapheneos-2026081300/apply_ui5c_ui6_system_surfaces.py --self-test
          python3 patches/android-17-grapheneos-2026081300/apply_r9_launcher3_foundation.py --self-test
          python3 build/gates/verify-r8-vendor-sable-inventory.py --self-test
          python3 build/gates/r9-launcher3-foundation-contract.py --self-test
          echo "R8_VENDOR_SABLE_INVENTORY_SELF_TEST=PASS"
          echo "R9_LAUNCHER3_FOUNDATION_APPLICATOR_SELF_TEST=PASS"
          echo "R9_LAUNCHER3_FOUNDATION_CONTRACT_SELF_TEST=PASS"
          echo "R8_PLATFORM_APPLICATOR_SELF_TESTS=PASS"

      - name: Product composition contract
        shell: bash
        run: |
          set -euo pipefail
          bp=product/r8/panther/Android.bp
          mk=product/r8/panther/r8-product.mk
          sync=build/panther/sync-sablestart.sh
          stage=build/panther/stage-r8-product-apps.sh
          gate=build/gates/r8-final-product-composition.sh

          for module in             SableCalculator             SableSudoku             SableMinesweeper             Sable2048             SableMedia             SableReader             SableHub             SableMail
          do
            grep -Fq "name: \"$module\"" "$bp"
          done

          for module in             SableCalculator             SableSudoku             SableMinesweeper             Sable2048             SableMedia             SableReader             SableHub             SableMail
          do
            grep -Fq "$module" "$mk"
          done
          ! grep -Fq 'SableStart' "$mk"

          grep -Fq 'overrides: ["ExactCalculator"]' "$bp"

          test "$(grep -Fc 'presigned: true,' "$bp")" -eq 8
          test "$(grep -Fc 'preprocessed: true,' "$bp")" -eq 8
          test "$(grep -Fc 'enabled: false,' "$bp")" -eq 8

          python3 - "$bp" <<'PY'
          import pathlib
          import re
          import sys

          text = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")
          expected = {
              "SableCalculator",
              "SableSudoku",
              "SableMinesweeper",
              "Sable2048",
              "SableMedia",
              "SableReader",
              "SableHub",
              "SableMail",
          }

          blocks = re.findall(r"android_app_import\s*\{(.*?)\n\}", text, flags=re.S)
          seen = set()
          for block in blocks:
              match = re.search(r'name:\s*"([^"]+)"', block)
              if not match or match.group(1) not in expected:
                  continue
              name = match.group(1)
              seen.add(name)
              for token in (
                  "presigned: true,",
                  "preprocessed: true,",
                  "dex_preopt:",
                  "enabled: false,",
              ):
                  if token not in block:
                      raise SystemExit(
                          f"missing {token!r} from {name}"
                      )

          if seen != expected:
              raise SystemExit(
                  f"wrong import set missing={sorted(expected-seen)!r}"
              )

          print("R8_PRESIGNED_APK_PREPROCESSED_STATIC=PASS")
          PY

          grep -Fq 'SableStartScreen.kt' "$sync"
          ! grep -Fq 'SableStartRoot.kt' "$sync"
          ! grep -Fq 'SableStartActivity.kt' "$sync"
          ! grep -Fq 'LauncherAppsRepository.kt' "$sync"
          ! grep -Fq 'rust/src/lib.rs' "$sync"
          test ! -e src/android/packages/apps/SableStart/AndroidManifest.xml
          test ! -e src/android/packages/apps/SableStart/src/com/sable/start/SableStartActivity.kt

          for script in "$stage" "$gate"
          do
            grep -Fq 'vendor/google_devices/panther/panther.mk' "$script"
            ! grep -Fq 'device/google/pantah/device-panther.mk' "$script"
          done

          exporter=apps/r8/export-panther-app-bundle.sh
          grep -Fq 'SABLEOS_SOURCE_COMMIT.txt' "$exporter"
          grep -Fq 'R8_APP_BUNDLE_SOURCE_COMMIT=FAIL_STALE' "$stage"
          grep -Fq 'R8_PRODUCT_SOURCE_IDENTITY' "$gate"

          echo "R8_BUNDLE_SOURCE_IDENTITY_CONTRACT=PASS"
          echo "R8_PANTHER_PRODUCT_PATH_CONTRACT=PASS"
          echo "R8_PRODUCT_COMPOSITION_CONTRACT=PASS"

      - name: Launcher3 foundation contract
        shell: bash
        run: |
          set -euo pipefail
          start_bp=src/android/packages/apps/SableStart/Android.bp
          final_build=build/panther/build-r8-final-ui.sh
          target_gate=build/gates/r8-final-target-files.sh
          qualifier=build/panther/qualify-r9-launcher3-foundation.sh
          applicator=patches/android-17-grapheneos-2026081300/apply_r9_launcher3_foundation.py

          python3 "$applicator" --self-test
          python3 build/gates/r9-launcher3-foundation-contract.py --self-test
          python3 build/gates/r9-launcher3-foundation-contract.py

          grep -Fq 'name: "sable_start_presentation_srcs"' "$start_bp"
          ! grep -Fq 'android_app {' "$start_bp"
          ! grep -Fq 'rust_ffi_shared {' "$start_bp"

          grep -Fq '===== LAUNCHER3 QUICKSTEP SOONG PREFLIGHT =====' "$final_build"
          grep -Fq 'm -j"$JOBS" Launcher3QuickStep' "$final_build"
          ! grep -Fq 'm -j"$JOBS" SableStart' "$final_build"

          grep -Fq 'Launcher3QuickStep.apk' "$target_gate"
          grep -Fq 'R9_STANDALONE_SABLESTART_TARGET=PASS_ABSENT' "$target_gate"
          grep -Fq 'R9_L7_LAUNCHER3_FOUNDATION_COMPILE=PASS' "$qualifier"

          echo "R9_LAUNCHER3_FOUNDATION_CI=PASS"

      - name: R8-A appearance contract
        shell: bash
        run: |
          set -euo pipefail
          theme=src/android/shared/sabledesign/src/main/java/org/sableos/design/SableTheme.kt
          start=src/android/packages/apps/SableStart/src/com/sable/start/ui/SableStartScreen.kt
          state=src/android/packages/apps/SableStart/src/com/sable/start/platform/StartStateRepository.kt
          global=src/android/shared/sabledesign/src/main/java/org/sableos/design/SableGlobalAppearance.kt
          provider=src/android/packages/apps/SableStart/src/com/sable/start/platform/SableAppearanceProvider.kt
          system_bars=src/android/shared/sabledesign/src/main/java/org/sableos/design/SableSystemBars.kt
          host=patches/android-17-grapheneos-2026081300/r9_launcher3/SableQuickstepLauncher.kt
          applicator=patches/android-17-grapheneos-2026081300/apply_r9_launcher3_foundation.py

          grep -Fq 'FollowSystem("follow-system")' "$theme"
          grep -Fq 'appearance: SableAppearance = SableAppearance()' "$theme"
          grep -Fq 'AppearanceMode.entries' "$start"
          grep -Fq 'AccentPreset.entries' "$start"
          grep -Fq 'Reset to Follow system · Sable Blue' "$start"
          grep -Fq 'fun resetAppearance()' "$state"
          ! grep -Fq 'private val SableColors' "$start"
          ! grep -Fq 'private val SableTypography' "$start"
          ! grep -Fq 'darkColorScheme(' "$start"

          grep -Fq 'org.sableos.start.appearance' "$global"
          grep -Fq 'rememberGlobalSableAppearance' "$global"
          grep -Fq 'SableGlobalTheme' "$global"
          grep -Fq 'SableGlobalAppearanceContract.CONTENT_URI' "$state"
          grep -Fq 'class SableAppearanceProvider' "$provider"
          grep -Fq 'org.sableos.start.appearance' "$applicator"
          grep -Fq 'SableAppearanceProvider' "$applicator"

          grep -Fq 'val decorView = window.decorView' "$system_bars"
          grep -Fq 'decorView.windowInsetsController?.setSystemBarsAppearance(' "$system_bars"
          grep -Fq 'if (decorView.isAttachedToWindow)' "$system_bars"
          grep -Fq 'decorView.post { applyAppearance() }' "$system_bars"
          ! grep -Fq 'window.insetsController' "$system_bars"

          grep -Fq 'homeGeneration = homeGeneration.value' "$host"
          grep -Fq 'backGeneration = backGeneration.value' "$host"
          grep -Fq 'protected override fun getOnBackAnimationCallback()' "$host"
          ! grep -Fq 'BackHandler(' "$start"

          for source in             apps/r8/android/calculator/src/main/java/org/sableos/calculator/MainActivity.kt             apps/r8/android/games/src/main/java/org/sableos/games/MainActivity.kt             apps/r8/android/media/src/main/java/org/sableos/media/MainActivity.kt             apps/r8/android/hub/src/main/java/org/sableos/hub/MainActivity.kt
          do
            grep -Fq 'SableGlobalTheme(window = window)' "$source"
          done

          grep -Fq 'SableGlobalAppearance.kt' apps/r8/reader/apply_sable_flavor.py

          echo "R9_SABLESTART_APPEARANCE_PROVIDER=PASS"
          echo "R9_SABLESTART_HOST_NAVIGATION=PASS"
          echo "R8_A_APPEARANCE_CONTRACT=PASS"
          echo "R8_GLOBAL_APPEARANCE_CONTRACT=PASS"

      - name: R9 combined SableStart contract
        shell: bash
        run: |
          set -euo pipefail
          python3 build/gates/r9-sablestart-design-contract.py --self-test
          python3 build/gates/r9-sablestart-design-contract.py
          python3 build/gates/r9-launcher3-foundation-contract.py
          grep -Fq 'R9_L6_VISUAL_REVIEW_STATUS=PENDING' build/gates/r8-final-product-composition.sh
          grep -Fq 'NEXT_FULL_PANTHER_BUILD_AUTHORIZED=NO' build/gates/r8-final-product-composition.sh
          grep -Fq 'R8_FINAL_BUILD=BLOCKED_R9_VISUAL_REVIEW' build/panther/build-r8-final-ui.sh
          echo "R9_SABLESTART_COMBINED_CI=PASS"
          echo "R9_LAUNCHER3_FOUNDATION_COMPOSITION_CI=PASS"

      - name: No stale product preview surfaces
        shell: bash
        run: |
          set -euo pipefail
          media_manifest=apps/r8/android/media/src/main/AndroidManifest.xml
          settings=apps/r8/android/settings.gradle.kts
          production_check=apps/r8/android/sablestart-production-check/build.gradle.kts

          ! grep -Fq 'MediaDesignPreviewActivity' "$media_manifest"
          test ! -e apps/r8/android/media/src/main/java/org/sableos/media/preview/MediaDesignPreviewActivity.kt
          test ! -e apps/r8/android/media/src/main/java/org/sableos/media/preview/MediaDesignPreviewScreen.kt

          test ! -e apps/r8/android/start-preview
          test ! -e apps/r8/android/system-preview
          test ! -e build/panther/build-ui-preview.sh
          test ! -e build/panther/flash-ui-preview-inactive-slot.sh
          test ! -e build/panther/validate-ui-preview.sh

          test ! -e src/android/packages/apps/SableStart/AndroidManifest.xml
          test ! -e src/android/packages/apps/SableStart/rust/src/lib.rs
          test ! -e src/android/packages/apps/SableStart/src/com/sable/start/SableStartActivity.kt
          test ! -e src/android/packages/apps/SableStart/src/com/sable/start/bridge/SableStartNative.kt
          test ! -e src/android/packages/apps/SableStart/src/com/sable/start/platform/LauncherAppsRepository.kt

          ! grep -Fq 'include(":start-preview")' "$settings"
          ! grep -Fq 'include(":system-preview")' "$settings"
          grep -Fq 'include(":sablestart-production-check")' "$settings"
          grep -Fq '../../../../src/android/packages/apps/SableStart/src' "$production_check"
          grep -Fq 'manifest.srcFile("src/main/AndroidManifest.xml")' "$production_check"
          ! grep -Fq '../../../../src/android/packages/apps/SableStart/AndroidManifest.xml' "$production_check"
          ! grep -Fq '../../../../src/android/packages/apps/SableStart/res' "$production_check"

          echo "R8_STALE_PRODUCT_PREVIEW_SURFACES=PASS_ABSENT"
          echo "R9_STANDALONE_SABLESTART_SOURCE=PASS_ABSENT"
          echo "R9_SABLESTART_PRESENTATION_COMPILE_SURFACE=PASS"

      - name: No stale R8 product code or packages
        shell: bash
        run: |
          set -euo pipefail
          bash build/gates/r8-no-stale-product-code.sh

      - name: Sable Mail source contract
        shell: bash
        run: |
          set -euo pipefail
          envfile=apps/r8/mail/upstream.env
          apply=apps/r8/mail/apply_sable_flavor.py
          verify=apps/r8/mail/verify_sable_mail.py

          grep -Fq 'THUNDERBIRD_COMMIT=c733317d933c22bcd790a4790306f30ccf2026b8' "$envfile"
          grep -Fq 'SABLE_MAIL_APPLICATION_ID=org.sableos.mail' "$envfile"
          grep -Fq 'projects.feature.funding.noop' "$apply"
          grep -Fq 'SABLE_MAIL_OAUTH=DISABLED_UNTIL_SABLE_CLIENT_REGISTRATION' "$apply"
          grep -Fq 'SABLE_MAIL_GLOBAL_APPEARANCE=FOLLOW_SYSTEM_LIGHT_DARK_PLUS_5_ACCENTS' "$apply"
          grep -Fq 'EXPECTED_PACKAGE = "org.sableos.mail"' "$verify"

          echo "R8_G_SABLE_MAIL_SOURCE_CONTRACT=PASS"

      - name: Final build environment contract
        shell: bash
        run: |
          set -euo pipefail
          config=build/config/panther-grapheneos-2026081300.env
          build=build/panther/build-r8-final-ui.sh

          grep -Fq 'export SABLEOS_LUNCH_TARGET=panther-cur-userdebug' "$config"
          grep -Fq 'lunch "$SABLEOS_LUNCH_TARGET" > >(tee "$EVIDENCE_DIR/lunch.log") 2>&1' "$build"
          ! grep -Eq 'lunch .*\|[[:space:]]*tee' "$build"
          grep -Fq 'TARGET_RELEASE:-' "$build"
          grep -Fq '== cur' "$build"
          grep -Fq 'unset BUILD_DATETIME' "$build"
          grep -Fq 'unset BUILD_NUMBER' "$build"

          host_profile=build/config/r8-host-tools.env
          release_profile=build/config/r8-release.env
          runner=build/panther/run-r8-release-candidate.sh

          grep -Fq '/srv/data/sable-host-tools' "$host_profile"
          ! grep -Fq '/srv/data/sable-build/host-tools/r8-final-v1' "$host_profile"
          grep -Fq 'SABLEOS_RELEASE_VERSION' "$release_profile"
          grep -Fq 'verify-r8-host-tools.sh' "$runner"
          grep -Fq 'prepare-r8-final-ui.sh' "$runner"
          grep -Fq 'build-r8-final-ui.sh' "$runner"
          bash build/gates/r8-build-driver-contract.sh

          echo "R8_CANONICAL_HOST_TOOL_CONTRACT=PASS"
          echo "R8_FINAL_BUILD_ENVIRONMENT_CONTRACT=PASS"

name: Supply-chain reproducibility baseline

on:
  pull_request:
    paths:
      - 'apps/r8/android/**'
      - 'apps/r8/rust/**'
      - 'build/check-ci-policy.py'
      - 'build/supply-chain-lock.json'
      - 'build/install-pinned-tool.py'
      - 'build/generate-supply-chain-evidence.py'
      - 'build/check-gradle-supply-chain.py'
      - '.github/workflows/supply-chain.yml'
      - '.github/workflows/r8-rust-security.yml'
      - '.github/workflows/security-baseline.yml'
      - '.github/workflows/quality-coverage.yml'
      - '.github/workflows/r8-apk-seal.yml'
  push:
    branches: [main]
    paths:
      - 'apps/r8/android/**'
      - 'apps/r8/rust/**'
      - 'build/check-ci-policy.py'
      - 'build/supply-chain-lock.json'
      - 'build/install-pinned-tool.py'
      - 'build/generate-supply-chain-evidence.py'
      - 'build/check-gradle-supply-chain.py'
      - '.github/workflows/supply-chain.yml'
      - '.github/workflows/r8-rust-security.yml'
      - '.github/workflows/security-baseline.yml'
      - '.github/workflows/quality-coverage.yml'
      - '.github/workflows/r8-apk-seal.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pinned-rust-tools-and-sbom:
    name: Pinned Rust tools and deterministic SBOM
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Validate pinned tool lock
        run: python3 build/install-pinned-tool.py --validate-lock
      - name: Install checksum-verified pinned Rust tools
        shell: bash
        run: |
          set -euo pipefail
          DEST="$RUNNER_TEMP/sable-pinned-tools"
          python3 build/install-pinned-tool.py --all --dest "$DEST"
          echo "$DEST" >> "$GITHUB_PATH"
      - name: Verify pinned tool versions
        run: |
          cargo-audit --version
          cargo-deny --version
          cargo-llvm-cov llvm-cov --version
      - name: Generate deterministic supply-chain evidence
        run: >-
          python3 build/generate-supply-chain-evidence.py
          --out SABLE_SUPPLY_CHAIN_EVIDENCE.json
          --rust-sbom SABLE_R8_RUST_SBOM.cdx.json
      - name: Seal supply-chain evidence
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            SABLE_SUPPLY_CHAIN_EVIDENCE.json \
            SABLE_R8_RUST_SBOM.cdx.json \
            > SABLE_SUPPLY_CHAIN_EVIDENCE.sha256
          cat SABLE_SUPPLY_CHAIN_EVIDENCE.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: r8-supply-chain-evidence-${{ github.sha }}
          path: |
            SABLE_SUPPLY_CHAIN_EVIDENCE.json
            SABLE_R8_RUST_SBOM.cdx.json
            SABLE_SUPPLY_CHAIN_EVIDENCE.sha256
          if-no-files-found: error
          retention-days: 30

  android-lock-enforcement:
    name: Android Gradle lock and verification enforcement
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate hosted Android SDK tools
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          test -n "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
      - name: Install exact Android SDK inputs
        shell: bash
        run: "$SDKMANAGER 'platforms;android-36' 'build-tools;36.0.0'"
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          gradle-version: '8.13'
      - name: Validate committed Gradle supply-chain state
        run: >-
          python3 build/check-gradle-supply-chain.py
          --manifest INFRA3_GRADLE_STATE_BEFORE.json
      - name: Exercise detached AAPT2 verification path
        shell: bash
        run: |
          set -euo pipefail
          gradle -p apps/r8/android \
            :calculator:compileDebugNavigationResources \
            --stacktrace
          echo "INFRA3_AAPT2_DETACHED_VERIFICATION_PATH=PASS"

      - name: Exercise detached Android Lint verification path
        shell: bash
        run: |
          set -euo pipefail
          gradle -p apps/r8/android \
            :design:lintDebug \
            --stacktrace
          echo "INFRA3_LINT_DETACHED_VERIFICATION_PATH=PASS"

      - name: Resolve dependencies under committed locks and verification metadata
        shell: bash
        run: |
          set -euo pipefail
          gradle -p apps/r8/android             :design:dependencies             :calculator:dependencies             :convert:dependencies             :games:dependencies             :media:dependencies             --stacktrace             > android-resolved-dependencies.txt
          test -s android-resolved-dependencies.txt
      - name: Prove committed Gradle state remained unchanged
        shell: bash
        run: |
          set -euo pipefail
          python3 build/check-gradle-supply-chain.py             --manifest INFRA3_GRADLE_STATE_AFTER.json
          cmp INFRA3_GRADLE_STATE_BEFORE.json INFRA3_GRADLE_STATE_AFTER.json
          echo "INFRA3_GRADLE_COMMITTED_STATE_IMMUTABLE=PASS"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: r8-android-gradle-supply-chain-evidence-${{ github.sha }}
          path: |
            INFRA3_GRADLE_STATE_BEFORE.json
            INFRA3_GRADLE_STATE_AFTER.json
            android-resolved-dependencies.txt
          if-no-files-found: error
          retention-days: 30

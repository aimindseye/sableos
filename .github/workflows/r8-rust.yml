name: R8 Rust correctness

on:
  pull_request:
    paths:
      - 'apps/r8/rust/**'
      - '.github/workflows/r8-rust.yml'
  push:
    branches: [main]
    paths:
      - 'apps/r8/rust/**'
      - '.github/workflows/r8-rust.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r8-rust-correctness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/r8/rust
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Unit tests
        run: cargo test --workspace --all-targets

name: R8 Rust security

on:
  pull_request:
    paths:
      - 'apps/r8/rust/**'
      - 'build/supply-chain-lock.json'
      - 'build/install-pinned-tool.py'
      - '.github/workflows/r8-rust-security.yml'
  push:
    branches: [main]
    paths:
      - 'apps/r8/rust/**'
      - 'build/supply-chain-lock.json'
      - 'build/install-pinned-tool.py'
      - '.github/workflows/r8-rust-security.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r8-rust-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: apps/r8/rust
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.98.1'
      - name: Verify committed dependency lock
        run: |
          test -f Cargo.lock
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
      - name: Install checksum-verified cargo-audit
        shell: bash
        run: |
          set -euo pipefail
          DEST="$RUNNER_TEMP/sable-pinned-tools"
          python3 "$GITHUB_WORKSPACE/build/install-pinned-tool.py" \
            --tool cargo-audit \
            --dest "$DEST"
          echo "$DEST" >> "$GITHUB_PATH"
      - name: RustSec audit
        run: cargo audit --deny warnings
      - name: Dependency inventory
        run: |
          cargo metadata --locked --no-deps --format-version 1 > r8-rust-metadata.json
          cargo tree --locked > r8-rust-dependency-tree.txt
          cat r8-rust-dependency-tree.txt

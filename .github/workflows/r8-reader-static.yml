name: R8 Reader static and policy

on:
  pull_request:
    paths:
      - 'apps/r8/reader/**'
      - '.github/workflows/r8-reader-static.yml'
  push:
    branches: [main]
    paths:
      - 'apps/r8/reader/**'
      - '.github/workflows/r8-reader-static.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r8-reader-static-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Read pinned upstream identity
        id: pin
        shell: bash
        run: |
          set -euo pipefail
          source apps/r8/reader/upstream.env
          echo "repository=$VAACHAK_REPOSITORY" >> "$GITHUB_OUTPUT"
          echo "commit=$VAACHAK_COMMIT" >> "$GITHUB_OUTPUT"
      - name: Checkout pinned Vaachak source
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-tags --filter=blob:none "${{ steps.pin.outputs.repository }}" /tmp/vaachak
          git -C /tmp/vaachak fetch --depth=1 origin "${{ steps.pin.outputs.commit }}"
          git -C /tmp/vaachak checkout --detach "${{ steps.pin.outputs.commit }}"
      - name: Apply Sable Reader flavor
        run: python3 apps/r8/reader/apply_sable_flavor.py /tmp/vaachak
      - uses: gradle/actions/setup-gradle@v4
      - name: Lint Sable Reader
        working-directory: /tmp/vaachak
        run: |
          chmod +x gradlew
          ./gradlew :leisure:lintSableDebug \
            --stacktrace --console=plain --no-daemon --no-configuration-cache
      - name: Verify first-R8 Sable Reader manifest has no INTERNET permission
        working-directory: /tmp/vaachak
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :leisure:processSableDebugMainManifest \
            --stacktrace --console=plain --no-daemon --no-configuration-cache
          MERGED="$(find leisure/build/intermediates -type f -name AndroidManifest.xml -path '*sableDebug*merged_manifest*' -print -quit)"
          test -n "$MERGED"
          if grep -q 'android.permission.INTERNET' "$MERGED"; then
            echo "SABLE_READER_INTERNET_PERMISSION=FAIL" >&2
            exit 1
          fi
          echo "SABLE_READER_INTERNET_PERMISSION=PASS"

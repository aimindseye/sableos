name: Main integrity

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: main-integrity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  integrity:
    name: Main fast-forward and governance integrity
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate CI trust policy
        run: python3 build/check-ci-policy.py
      - name: Validate main update integrity
        env:
          SABLE_MAIN_BEFORE: ${{ github.event.before }}
          SABLE_MAIN_AFTER: ${{ github.sha }}
        run: >-
          python3 build/check-main-integrity.py
          --before "$SABLE_MAIN_BEFORE"
          --after "$SABLE_MAIN_AFTER"

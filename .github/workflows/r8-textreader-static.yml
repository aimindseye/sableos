name: R8 Text Reader static and capability policy

on:
  pull_request:
    paths:
      - 'apps/r8/textreader/**'
      - '.github/workflows/r8-textreader-static.yml'
  push:
    branches: [main]
    paths:
      - 'apps/r8/textreader/**'
      - '.github/workflows/r8-textreader-static.yml'

permissions:
  contents: read

concurrency:
  group: r8-textreader-static-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Read pinned upstream identity
        id: pin
        shell: bash
        run: |
          set -euo pipefail
          source apps/r8/textreader/upstream.env
          echo "repository=$VAACHAK_TEXTREADER_REPOSITORY" >> "$GITHUB_OUTPUT"
          echo "commit=$VAACHAK_TEXTREADER_COMMIT" >> "$GITHUB_OUTPUT"
      - name: Checkout pinned source
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-tags --filter=blob:none "${{ steps.pin.outputs.repository }}" /tmp/vaachak-textreader
          git -C /tmp/vaachak-textreader fetch --depth=1 origin "${{ steps.pin.outputs.commit }}"
          git -C /tmp/vaachak-textreader checkout --detach "${{ steps.pin.outputs.commit }}"
          test "$(git -C /tmp/vaachak-textreader rev-parse HEAD)" = "${{ steps.pin.outputs.commit }}"
      - uses: gradle/actions/setup-gradle@v4
      - name: Android lint
        working-directory: /tmp/vaachak-textreader
        run: |
          chmod +x gradlew
          ./gradlew lintDebug --stacktrace --console=plain --no-daemon --no-configuration-cache
      - name: Verify qualified capability surfaces
        shell: bash
        run: |
          set -euo pipefail
          manifest=/tmp/vaachak-textreader/app/src/main/AndroidManifest.xml
          main=/tmp/vaachak-textreader/app/src/main/java/org/vaachak/textreader/MainActivity.kt
          shared=/tmp/vaachak-textreader/app/src/main/java/org/vaachak/textreader/SharedComponents.kt
          util=/tmp/vaachak-textreader/app/src/main/java/org/vaachak/textreader/TextReaderUtil.kt

          grep -q 'android.permission.CAMERA' "$manifest"
          grep -q 'android.hardware.camera.*required="false"' "$manifest"
          grep -q 'android.permission.INTERNET' "$manifest"
          grep -q 'android.intent.action.SEND' "$manifest"
          grep -q 'android.intent.action.PROCESS_TEXT' "$manifest"
          grep -q 'text/plain' "$manifest"

          grep -q 'ActivityResultContracts.OpenDocument' "$main"
          grep -q 'TextToSpeech' "$main"
          grep -q 'CreateDocument("audio/wav")' "$main"
          grep -q 'TextRecognition.getClient' "$main"
          grep -q 'downloadModelIfNeeded' "$shared"

          if grep -q '^import android\.' "$util"; then
            echo 'TextReaderUtil unexpectedly gained an Android framework dependency' >&2
            exit 1
          fi

          echo 'QUALIFIED_CAMERA_OPTIONAL=PASS'
          echo 'QUALIFIED_TXT_DOCUMENT_PICKER=PASS'
          echo 'QUALIFIED_SHARE_PROCESS_TEXT=PASS'
          echo 'QUALIFIED_TTS_AUDIO_EXPORT=PASS'
          echo 'QUALIFIED_OCR_SURFACE=PASS'
          echo 'UPSTREAM_INTERNET_DECLARATION=OBSERVED'
          echo 'TRANSLATION_MODEL_DOWNLOAD_PATH=OBSERVED'
          echo 'TEXT_STREAM_CORE_ANDROID_INDEPENDENCE=PASS'

# SableOS source analysis, modeled on aimindseye/zinwaq25-sableos.
# Configure a SonarQube Cloud project with this exact key and organization;
# disable SonarQube Cloud Automatic Analysis when CI-based analysis is enabled.
sonar.organization=aimindseye
sonar.projectKey=aimindseye_sableos
sonar.projectName=SableOS
sonar.sourceEncoding=UTF-8

# Canonical SableOS product sources, not cloned AOSP/Treble or vendor binaries.
sonar.sources=apps,build,config,device,product,reference,release,src,tools
sonar.tests=tests
sonar.test.inclusions=tests/**
sonar.exclusions=apps/**/build/**,src/**/build/**,**/.gradle/**,**/out/**,**/generated/**,**/node_modules/**,**/src/test/**,**/src/androidTest/**,**/src/androidUnitTest/**,**/*.java,**/*.png,**/*.jpg,**/*.jpeg,**/*.webp,**/*.gif,**/*.ttf,**/*.otf,**/*.woff,**/*.woff2,**/*.jar,**/*.apk,**/*.zip,**/*.so,**/*.dex,**/*.corrupt,apps/r8/android/reader/leisure/src/main/assets/inflections.json,apps/r8/android/reader/leisure/src/main/assets/dictionary.json
sonar.python.version=3.12

# Binary assets, archived evidence, and large generated dictionary assets are not source.\n# Java needs compiled bytecode to be analyzed reliably. Until an Android/Gradle
# bytecode job is wired in, .java files are intentionally not in this scan.
# Kotlin and other supported source languages are still analyzed as applicable.
# A live SonarQube quality-gate PASS is not a Gradle/APK/Android-build PASS.

# Mirror Q25's initial SonarCloud gate policy: until a real coverage report is
# available, do not misrepresent missing coverage as measured uncovered lines.
sonar.coverage.exclusions=**/*
